[project]
name = "heygen-lab"
version = "0.1.0"
description = "Laboratório da API do HeyGen — gera vídeo de avatar a partir de texto"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0", "python-dotenv>=1.0.0", "pyyaml>=6.0"]

[project.scripts]
heygen-lab = "heygen_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heygen_lab"]
