# Dicionário de pronúncia — termo real → como o TTS deve ler.
#
# Aplicado SOMENTE no texto que vai pro ElevenLabs (--el). O roteiro e a
# legenda mantêm a grafia verdadeira. Casa palavra inteira, sem diferenciar
# maiúscula. Termo escrito ERRADO de propósito (piada do typo) não está aqui,
# então passa reto — é assim que se preserva o erro intencional.
